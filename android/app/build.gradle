plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Private builds can seed a NAS profile without committing credentials to source control.
def nasDefaultsFile = rootProject.file('sftp-default.local.json')
def nasDefaultJson = ''
if (nasDefaultsFile.isFile()) {
    try {
        def nas = new groovy.json.JsonSlurper().parseText(nasDefaultsFile.getText('UTF-8'))
        if (!(nas instanceof Map) || !nas.host || !nas.username) throw new IllegalArgumentException()
        nasDefaultJson = groovy.json.JsonOutput.toJson(nas)
    } catch (Exception ignored) {
        throw new GradleException('El archivo local del servidor SFTP predeterminado no es válido')
    }
}

android {
    namespace 'com.valerogarte.comicsreader'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.valerogarte.comicsreader'
        minSdk 24
        targetSdk 36
        versionCode 24
        versionName '2.1.21'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'NAS_DEFAULT_JSON', groovy.json.JsonOutput.toJson(nasDefaultJson)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/cajJni')
}

def buildCajNative = tasks.register('buildCajNative', Exec) {
    inputs.files(fileTree('src/main/rust') { exclude '**/target/**' })
    outputs.dir(layout.buildDirectory.dir('generated/cajJni'))
    commandLine 'bash', file('src/main/rust/build-android.sh').absolutePath,
        layout.buildDirectory.dir('generated/cajJni').get().asFile.absolutePath,
        layout.buildDirectory.dir('caj-rust').get().asFile.absolutePath
}
tasks.named('preBuild').configure { dependsOn buildCajNative }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'com.artifex.mupdf:fitz:1.28.5'
    implementation 'me.zhanghai.android.libarchive:library:1.1.6'
    implementation 'com.github.chimenchen:jchmlib:v0.5.4'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
